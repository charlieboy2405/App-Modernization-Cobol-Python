[tool.poetry]
name = "account-verify"
version = "1.0.0"
description = "Python conversion of COBOL ACCOUNT-VERIFY program - Account verification service with FastAPI"
authors = ["charlieboy2405"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.28.0"
ruff = "^0.9.0"

[tool.poetry.scripts]
account-verify-cli = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
